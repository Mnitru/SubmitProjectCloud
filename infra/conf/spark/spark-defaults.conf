# Template rendered by infra/linux/configure.sh (envsubst).
# Cluster-wide defaults. Compression settings (storage codec, shuffle codec)
# are NOT set here: the experiment runner passes them per run with --conf.

spark.master                           spark://${MASTER_HOST}:7077
spark.driver.memory                    ${SPARK_DRIVER_MEMORY}
spark.executor.memory                  ${SPARK_EXECUTOR_MEMORY}
spark.executor.cores                   ${SPARK_EXECUTOR_CORES}
spark.cores.max                        ${TOTAL_CORES}
spark.serializer                       org.apache.spark.serializer.KryoSerializer

# Event logs = raw per-task metrics (CPU time, shuffle bytes, shuffle time...)
spark.eventLog.enabled                 true
spark.eventLog.dir                     file:///data/spark-events
spark.eventLog.compress                false
spark.history.fs.logDirectory          file:///data/spark-events

# Keep the physical plan identical whatever the codec:
#  - AQE would re-plan based on (compressed) shuffle sizes
#  - broadcast joins would hide the shuffle we want to measure
#  - one input split per file, whatever the file's compressed size
spark.sql.adaptive.enabled             false
spark.sql.autoBroadcastJoinThreshold   -1
spark.sql.files.maxPartitionBytes      256m
spark.sql.files.openCostInBytes        256m
spark.hadoop.parquet.block.size        268435456

# Start jobs only once every executor has registered (worker3 on the laptop
# starts a few seconds later than the desktop workers)
spark.scheduler.minRegisteredResourcesRatio   1.0
spark.scheduler.maxRegisteredResourcesWaitingTime 120s

# Wi-Fi link to the laptop: be tolerant to slow transfers
spark.network.timeout                  300s
spark.ui.showConsoleProgress           false
