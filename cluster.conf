# =====================================================================
#  Cluster configuration - single source of truth.
#  Read by bash (source) on the VMs and by infra/windows/desktop.ps1.
#  Format: KEY=VALUE, one per line, no spaces around '='.
# =====================================================================

# ---- Nodes -----------------------------------------------------------
UBUNTU_IMAGE=22.04
NODES="master worker1 worker2 worker3"
WORKERS="worker1 worker2 worker3"
# VMs hosted on the desktop (Windows 11 Pro, Hyper-V)
DESKTOP_NODES="master worker1 worker2"
# VMs hosted on the laptop (Windows 11 Home, VirtualBox, Wi-Fi)
LAPTOP_NODES="worker3"

# ---- VM sizes ----------------------------------------------------------
MASTER_CPUS=2
MASTER_MEM=4G
MASTER_DISK=40G
WORKER_CPUS=3
WORKER_MEM=6G
WORKER_DISK=60G

# ---- Cluster overlay network (WireGuard full mesh) -------------------
# Hadoop/Spark only use these addresses (via /etc/hosts).
WG_PREFIX=24
WG_PORT=51820
WG_IP_master=10.99.0.10
WG_IP_worker1=10.99.0.11
WG_IP_worker2=10.99.0.12
WG_IP_worker3=10.99.0.13

# ---- Home LAN (desktop VMs are bridged to it; WireGuard endpoints) ----
# Multipass network name of the Hyper-V external switch on the desktop
DESKTOP_BRIDGE="ExtSwitch (Ethernet)"
LAN_PREFIX=24
LAN_IP_master=192.168.1.201
LAN_IP_worker1=192.168.1.202
LAN_IP_worker2=192.168.1.203
LAN_MAC_master=52:54:00:99:01:01
LAN_MAC_worker1=52:54:00:99:01:02
LAN_MAC_worker2=52:54:00:99:01:03
# Port of the temporary HTTP server on master that hands worker3 its config
JOIN_PORT=8000

# ---- Software ---------------------------------------------------------
HADOOP_VERSION=3.3.6
SPARK_VERSION=3.5.3
HDFS_REPLICATION=2

# ---- Spark resources (per worker node) --------------------------------
SPARK_WORKER_CORES=3
SPARK_WORKER_MEMORY=4g
SPARK_EXECUTOR_CORES=3
SPARK_EXECUTOR_MEMORY=3g
SPARK_DRIVER_MEMORY=1g

# ---- Network shaping on wg0 (tc tbf), same on every node --------------
# Measured over the overlay (results/netbench.csv): laptop <-> desktop
# 89-100 Mbit/s (Wi-Fi + VirtualBox NAT), desktop VM <-> desktop VM 4-5 Gbit/s.
# Every node is capped at 100 Mbit/s so that all links have the same nominal
# bandwidth (emulated Fast-Ethernet cluster network). "none" = no limit.
NET_RATE=100mbit
